name: CI/CD Deploy

on:
    push:
        branches: ["develop", "main"] # develop → DEV / main → PROD

jobs:
    build-and-deploy:
        runs-on: [self-hosted, linux, x64] # 등록한 Runner 라벨과 동일해야 함
        environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

        steps:
            # 1. 저장소 코드 가져오기
            - name: Checkout
              uses: actions/checkout@v4

            # 2. 대상 환경 결정 (브랜치 기준)
            - name: Decide target
              id: pick
              run: |
                  if [[ "${GITHUB_REF##*/}" == "main" ]]; then
                    echo "env=prod" >> $GITHUB_OUTPUT
                  else
                    echo "env=dev" >> $GITHUB_OUTPUT
                  fi

            # 3. Node.js (프론트 빌드)
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.4.1"

            - name: Build Frontend
              working-directory: frontend/realty
              run: |
                  npm ci
                  npm run build
            - run: mv frontend/realty/dist ./dist
            # 4. Java (백엔드 빌드)
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Build Backend
              working-directory: backend
              run: ./gradlew clean build -x test

            - name: Check JAR exists
              run: ls -al backend/build/libs

            # 5. Python (AI 서버 압축)
            - name: Archive AI source
              run: |
                  tar -czf ai_src.tar.gz -C ai-api .

            # 6. 서버 배포 스크립트 실행 (로컬 실행)
            - name: Deploy locally
              run: |
                  chmod +x /srv/riskview/deploy.sh
                  /srv/riskview/deploy.sh ${{ steps.pick.outputs.env }} $(date +%Y%m%d%H%M%S)
