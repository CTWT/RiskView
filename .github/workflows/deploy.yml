name: CI/CD Deploy

on:
    push:
        branches: ["develop", "main"] # develop → DEV / main → PROD
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: [self-hosted, linux, x64] # 등록한 Runner 라벨과 동일해야 함
        environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

        steps:
            # 1. 저장소 코드 가져오기
            - name: Checkout
              uses: actions/checkout@v4

            # 2. 대상 환경 결정 (브랜치 기준)
            - name: Decide target
              id: pick
              run: |
                  if [[ "${GITHUB_REF##*/}" == "main" ]]; then
                    echo "env=prod" >> $GITHUB_OUTPUT
                  else
                    echo "env=dev" >> $GITHUB_OUTPUT
                  fi

            # 3. Node.js (프론트 빌드)
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.4.1"

            - name: Build Frontend
              working-directory: frontend/realty
              run: |
                  npm ci
                  npm run build
            - run: mv frontend/realty/dist ./dist
            # 4. Java (백엔드 빌드)
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Build Backend
              working-directory: backend
              run: ./gradlew clean build -x test

            - name: Check JAR exists
              run: ls -al backend/build/libs

            # 5. Python (AI 서버 압축)
            - name: Archive AI source
              run: |
                  tar -czf ai_src.tar.gz -C ai-api .

            # 6. (SELF-HOSTED) 산출물 /tmp 로 스테이징
            - name: Stage artifacts locally (self-hosted)
              run: |
                  set -e
                  echo "📦 Stage frontend dist -> /tmp"
                  rm -rf /tmp/dist
                  mv ./dist /tmp/dist

                  echo "📦 Pick backend jar -> /tmp/app.jar"
                  JAR_CANDIDATE=$(ls -1 backend/build/libs/*.jar | grep -v '\-plain\.jar' | head -n 1 || true)
                  if [ -z "$JAR_CANDIDATE" ]; then
                    # non-plain 이 없으면 아무거나 하나 선택
                    JAR_CANDIDATE=$(ls -1 backend/build/libs/*.jar | head -n 1 || true)
                  fi
                  if [ -z "$JAR_CANDIDATE" ]; then
                    echo "❌ JAR 파일을 찾지 못했습니다: backend/build/libs/*.jar"
                    exit 1
                  fi
                  cp "$JAR_CANDIDATE" /tmp/app.jar
                  ls -al /tmp/app.jar

                  echo "📦 AI source -> /tmp/ai_src.tar.gz"
                  mv ai_src.tar.gz /tmp/ai_src.tar.gz
                  ls -al /tmp/ai_src.tar.gz

            # 6.5 application.yml 덮어쓰기 방지
            - name: Do not overwrite application.yml
              run: |
                  if [ -f /srv/riskview/backend/src/main/resources/application.yml ]; then
                    echo "✅ application.yml already exists, skipping copy."
                  else
                    echo "⚠️ application.yml is missing! Please place it manually."
                    exit 1
                  fi

            # 7. (SELF-HOSTED) 서버 배포 스크립트 '로컬' 실행
            - name: Deploy locally
              run: |
                  echo "🚀 Deploy..."
                  /srv/riskview/deploy.sh ${{ steps.pick.outputs.env }} $(date +%Y%m%d%H%M%S)
                  echo "✅ Deploy finished"
