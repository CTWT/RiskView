name: CI/CD Deploy

on:
    push:
        branches: ["develop", "main"]
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: [self-hosted, linux, x64]
        environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

        steps:
            # 1. 저장소 코드 가져오기
            - name: Checkout
              uses: actions/checkout@v4

            # 2. 대상 환경 결정
            - name: Decide target
              id: pick
              run: |
                  if [[ "${GITHUB_REF##*/}" == "main" ]]; then
                    echo "env=prod" >> $GITHUB_OUTPUT
                  else
                    echo "env=dev" >> $GITHUB_OUTPUT
                  fi

            # 3. .env 파일들 먼저 복사 (.env 적용된 상태로 빌드되도록)
            - name: Copy Frontend .env if missing
              run: |
                  TARGET=frontend/realty/.env
                  SOURCE=/srv/riskview/config/frontend/.env

                  if [ -f "$TARGET" ]; then
                      echo "✅ Frontend .env already exists, skipping copy."
                  elif [ -f "$SOURCE" ]; then
                      echo "📂 Copying frontend .env from backup"
                      cp "$SOURCE" "$TARGET"
                  else
                      echo "❌ Frontend .env not found in either location."
                      exit 1
                  fi

            - name: Copy AI .env if missing
              run: |
                  TARGET=ai-api/.env
                  SOURCE=/srv/riskview/config/ai/.env

                  if [ -f "$TARGET" ]; then
                      echo "✅ AI .env already exists, skipping copy."
                  elif [ -f "$SOURCE" ]; then
                      echo "📂 Copying AI .env from backup"
                      cp "$SOURCE" "$TARGET"
                  else
                      echo "❌ AI .env not found in either location."
                      exit 1
                  fi

            - name: Copy application.yml if missing
              run: |
                  TARGET=backend/src/main/resources/application.yml
                  SOURCE=/srv/riskview/config/application.yml

                  if [ -f "$TARGET" ]; then
                      echo "✅ application.yml already exists, skipping copy."
                  elif [ -f "$SOURCE" ]; then
                      echo "📂 Copying application.yml from backup"
                      cp "$SOURCE" "$TARGET"
                  else
                      echo "❌ application.yml not found in either location."
                      exit 1
                  fi

            # 4. Node.js (프론트 빌드)
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.4.1"

            - name: Build Frontend
              working-directory: frontend/realty
              run: |
                  npm ci
                  npm run build

            - run: mv frontend/realty/dist ./dist

            # 5. Java (백엔드 빌드)
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Build Backend
              working-directory: backend
              run: ./gradlew clean build -x test

            - name: Check JAR exists
              run: ls -al backend/build/libs

            # 6. Python (AI 서버 압축)
            - name: Archive AI source
              run: |
                  tar -czf ai_src.tar.gz -C ai-api .

            # 7. 산출물 /tmp 로 스테이징
            - name: Stage artifacts locally (self-hosted)
              run: |
                  set -e
                  echo "📦 Stage frontend dist -> /tmp"
                  rm -rf /tmp/dist
                  mv ./dist /tmp/dist

                  echo "📦 Pick backend jar -> /tmp/app.jar"
                  JAR_CANDIDATE=$(ls -1 backend/build/libs/*.jar | grep -v '\-plain\.jar' | head -n 1 || true)
                  if [ -z "$JAR_CANDIDATE" ]; then
                    JAR_CANDIDATE=$(ls -1 backend/build/libs/*.jar | head -n 1 || true)
                  fi
                  if [ -z "$JAR_CANDIDATE" ]; then
                    echo "❌ JAR 파일을 찾지 못했습니다: backend/build/libs/*.jar"
                    exit 1
                  fi
                  cp "$JAR_CANDIDATE" /tmp/app.jar
                  ls -al /tmp/app.jar

                  echo "📦 AI source -> /tmp/ai_src.tar.gz"
                  mv ai_src.tar.gz /tmp/ai_src.tar.gz
                  ls -al /tmp/ai_src.tar.gz

            # 8. 서버 배포 스크립트 실행
            - name: Deploy locally
              run: |
                  echo "🚀 Deploy..."
                  /srv/riskview/deploy.sh ${{ steps.pick.outputs.env }} $(date +%Y%m%d%H%M%S)
                  echo "✅ Deploy finished"
