plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'realty'
version = '0.0.1-SNAPSHOT'


bootJar {
    archiveFileName = "app.jar"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto' // bcrypt사용을 위한 의존성
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-mail' // JavaMailSender사용을 위한 의존성
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // JWT 관련 의존성
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5' // JWT 관련 의존성
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JWT 관련 의존성
	implementation 'org.openkoreantext:open-korean-text:2.1.0' // 형태소 분석을 위한 의존성
}

tasks.named('test') {
	useJUnitPlatform()
}
