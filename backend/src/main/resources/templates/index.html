<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
</head>
<body>

    <h1>RiskView 메인 화면</h1>
    
    <!-- 로그인했을 경우 표시할 화면 -->
    <div th:if="${session.user}">
        <p th:text="'안녕하세요, ' + ${session.user.name} + '님!'"></p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">로그아웃</button>
        </form>

        <form th:action="@{/delete_account}" method="post">
            <button type="submit">회원탈퇴</button>
        </form>
        
        <!-- 로그인 이력 표시 -->
        <div th:if="${session.loginHistoryList != null and !#lists.isEmpty(session.loginHistoryList)}">
            <h3>로그인 이력</h3>
            <div th:each="loginHistory : ${session.loginHistoryList}">
                <ul>
                    <li th:text="|로그인 시각: ${loginHistory.loginTime}|"></li>
                    <li th:text="|IP 주소: ${loginHistory.ipAddress}|"></li>
                    <li th:text="|User-Agent: ${loginHistory.userAgent}|"></li>
                </ul>
                <hr/> <!-- 각 로그인 기록을 구분하기 위한 구분선 -->
            </div>
        </div>
        
        <!-- 로그인 이력이 없는 경우 -->
        <div th:if="${session.loginHistoryList == null or #lists.isEmpty(session.loginHistoryList)}">
            <p>로그인 이력이 없습니다.</p>
        </div>
    </div>

    <!-- 아직 로그인 안 했을 경우 표시할 화면 -->
    <div th:if="${session.user} == null">
        <p>로그인이 필요합니다.</p>
        <form th:action="@{/login}" method="get">
            <button type="submit">로그인</button>
        </form>
        <form th:action="@{/register}" method="get">
            <button type="submit">회원가입</button>
        </form>
    </div>

</body>
</html>
