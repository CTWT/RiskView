<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>RiskView 아이디 찾기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 100px;
        }
        input[type="text"], input[type="email"] {
            width: 250px;
            padding: 5px;
        }
        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            margin-right: 15px;
            text-decoration: none;
            color: #337ab7;
        }
    </style>
</head>

<body>
    <h1>아이디 찾기</h1>
    
    <form th:action="@{/forgot_id}" th:method="post" th:object="${userDTO}">
        <div class="form-group">
            <label for="name">이름:</label>
            <input type="text" th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label for="email">이메일:</label>
            <input type="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <button type="submit">아이디 찾기</button>
        </div>
        
        <div th:if="${success}" class="message success" th:text="${success}">
        </div>

        <div th:if="${error}" class="message error" th:text="${error}">
        </div>
        
        <div th:if="${foundId}" class="message success">
            회원님의 아이디는 <strong th:text="${foundId}"></strong> 입니다.
        </div>
    </form>
    
    <div class="links">
        <a th:href="@{/login}">로그인</a>
        <a th:href="@{/forgot_pass}">비밀번호 찾기</a>
        <a th:href="@{/register}">회원가입</a>
    </div>
</body>
</html>
