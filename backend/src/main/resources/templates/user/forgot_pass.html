<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>RiskView 비밀번호 찾기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 120px;
        }
        input[type="text"], 
        input[type="email"],
        input[type="password"] {
            width: 250px;
            padding: 5px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            margin: 15px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            margin-right: 15px;
            text-decoration: none;
            color: #337ab7;
        }
    </style>
</head>

<body>
    <h1>비밀번호 찾기</h1>
    
    <form th:action="@{/forgot_pass}" th:method="post" th:object="${userDTO}">
        <!-- 사용자 ID -->
        <div class="form-group">
            <label for="userId">아이디:</label>
            <input type="text" th:field="*{userId}" required>
        </div>
        
        <!-- 이메일 -->
        <label for="email">이메일:</label>
        <input type="email" th:field="*{email}" required>
        <!-- 인증코드 발송: emailVerificationCode와 연결됨 -->
        <button type="button" id="sendEmailVerificationCode">인증코드 발송</button><br><br>

        <!-- 이메일 인증 -->
        <label for="emailVerificationCode">이메일 인증코드:</label>
        <input type="text" id="emailVerificationCodeInput" name="emailVerificationCode" required>
        <!-- 확인 버튼: emailVerificationCode와 연결됨 -->
        <button type="button" id="verifyEmailCodeButton">확인</button><br><br>

        <div class="form-group">
            <button type="submit">비밀번호 찾기</button>
        </div>
    </form>
    
    <div class="links">
        <a th:href="@{/login}">로그인</a>
        <a th:href="@{/forgot_id}">아이디 찾기</a>
        <a th:href="@{/register}">회원가입</a>
    </div>

    <div th:if="${error}" th:text="${error}" style="color:red;"></div>

    <!-- 이메일 인증 코드 관련 스크립트 -->
    <script src="/js/emailVerificationCode.js"></script>
</body>
</html>
