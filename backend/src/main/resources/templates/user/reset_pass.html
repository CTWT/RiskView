<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>새 비밀번호 설정</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 120px;
        }
        input[type="text"], 
        input[type="email"],
        input[type="password"] {
            width: 250px;
            padding: 5px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            margin: 15px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            margin-right: 15px;
            text-decoration: none;
            color: #337ab7;
        }
    </style>
</head>

<body>
    <h1>비밀번호 재설정</h1>

    <!-- 메시지 영역: 에러/성공 메시지 -->
    <div th:if="${error}" class="message error" th:text="${error}"></div>
    <div th:if="${success}" class="message success" th:text="${success}"></div>

    <form th:action="@{/reset_pass}" th:method="post" th:object="${userDTO}">
        <div class="form-group">
            <label for="newPassword">새 비밀번호:</label>
            <input type="password"
                    th:field="*{newPassword}"
                    required />
        </div>
        <div class="form-group">
            <label for="confirmNewPassword">비밀번호 확인:</label>
            <input type="password"
                    th:field="*{confirmNewPassword}"
                    required />
        </div>
        <div class="form-group">
            <button type="submit">비밀번호 변경</button>
        </div>
    </form>
</body>
</html>
